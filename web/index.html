  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0B5551;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0B5551;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>
  <!-- No service worker: the POS must never serve a stale build, and the
       Android app ships as an APK where a SW is dead weight anyway. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register = function () {
        return Promise.reject(new Error('service worker disabled'));
      };
    }

    // Viewport nudge for the boot splash. While the launch screen is held
    // (deferred first frame), the web engine can lay its first frames out at
    // a transient viewport size and never re-read the window — the splash
    // then renders as a small card in the corner until the next DOM change.
    // A synthetic resize makes the engine re-read the real flutter-view box;
    // it is a no-op once the size is already correct. The poll fires the
    // nudge exactly when the engine mounts flutter-view (with retries to
    // cover registration races), plus timed nudges as a safety net.
    (function () {
      function nudge() { window.dispatchEvent(new Event('resize')); }
      var tries = 0;
      (function poll() {
        if (++tries > 30) return; // flutter never mounted (e.g. JS off)
        if (document.querySelector('flutter-view')) {
          nudge();
          setTimeout(nudge, 60);
          setTimeout(nudge, 250);
          return;
        }
        setTimeout(poll, 100);
      })();
      [500, 1200].forEach(function (d) { setTimeout(nudge, d); });
    })();
  </script>


</body></html>
