name: fufut_pos
description: "Fufut Coffee POS — Android & desktop point of sale for the Fufut floor."
publish_to: "none"
version: 1.2.0+26

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # Web SSE transport — package:web EventSource bindings (the browser's own
  # primitive, same as the PWA's useSSE.js). Native platforms stream the
  # same wire format through package:http instead.
  web: ^1.1.1
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  audioplayers: ^6.1.0
  # The tables screen's "Print QR Card" — the native equivalent of the web's
  # print popup: a one-page PDF card (brand + table + QR) handed to the
  # system print dialog / save-as-PDF.
  printing: ^5.14.3
  pdf: ^3.11.3
  # Regular dependency (not dev): main.dart calls preserve()/remove() to hold
  # the native launch screen until the Flutter splash has painted its first
  # frame, so there is no white flash between engine start and the brand boot.
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Launcher icons cut from the same brand asset the PWA install screen uses
# (fufut-management/pos/public/pwa-icon-*.png): the teal FU FUT COFFEE seal.
# The maskable PNG already carries the safe-zone padding, so it drops
# straight in as the adaptive foreground over the brand teal.
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F7B78"
  adaptive_icon_foreground: "assets/icon/app_icon_maskable.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0F7B78"
    theme_color: "#0F7B78"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

# Boot splash cut from the same seal the launcher icons use. The background
# is the exact midpoint of the in-app boot gradient (#0C5F5B → #0A4A47), so
# the native splash hands off to the Flutter splash without a visible seam.
# The splash image is the same white launcher badge the Flutter splash hero
# uses — the old splash_logo.png was dark teal on teal (contrast ~30) and read
# as a ghost. android12 image is pre-padded: badge sits inside the system's
# circular mask with a teal ring, landing at ~140dp on screen.
flutter_native_splash:
  color: "#0B5551"
  color_dark: "#0B5551"
  image: assets/branding/splash_badge.png
  image_dark: assets/branding/splash_badge.png
  android_12:
    color: "#0B5551"
    color_dark: "#0B5551"
    image: assets/branding/splash_badge_android12.png
    image_dark: assets/branding/splash_badge_android12.png
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center
  fullscreen: false
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/branding/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-500.ttf
          weight: 500
        - asset: assets/fonts/FiraCode-600.ttf
          weight: 600
        - asset: assets/fonts/FiraCode-700.ttf
          weight: 700
