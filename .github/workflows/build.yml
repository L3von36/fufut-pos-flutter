name: Build APK & Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Also build macOS (macOS runners consume 10x minutes on private repos)"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # Infos are not fatal by default: the const lints stay as advice while
      # a genuine error or warning still stops the build.
      - run: flutter analyze
      - run: flutter test

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # Release signing comes later; until a keystore is configured the
      # release build is signed with debug keys, which installs and runs —
      # the right default for a testing build handed to the floor.
      - run: flutter build apk --release
      - name: Also build split ABIs (smaller downloads per device)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: fufut-pos-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - name: Pack
        run: |
          cd build/linux/x64/release/bundle
          tar czf ../../../fufut-pos-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: fufut-pos-linux
          path: build/linux/fufut-pos-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-latest
    needs: analyze
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath fufut-pos-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fufut-pos-windows
          path: fufut-pos-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS desktop (optional)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    runs-on: macos-latest
    needs: analyze
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release --no-codesign
      - name: Pack
        run: |
          cd build/macos/Build/Products/Release
          zip -qry fufut-pos-macos.zip fufut_pos.app
      - uses: actions/upload-artifact@v4
        with:
          name: fufut-pos-macos
          path: build/macos/Build/Products/Release/fufut-pos-macos.zip
          if-no-files-found: error

  # Tag push (v1.2.3) → builds everything, then creates the GitHub Release
  # and attaches the APK + desktop bundles to it, so the floor installs from
  # one link. Publishing a release by hand from the GitHub UI does the same.
  release:
    name: Attach artifacts to release
    if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [apk, linux, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release (tag push)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > release-notes.md <<'NOTES'
          Automated build from CI.

          ## Install
          - **Android** — download `app-release.apk` and open it on the phone
            (works on any device; the other APKs are smaller per-ABI variants
            of the same app).
          - **Windows** — download `fufut-pos-windows-x64.zip`, unzip, run
            `fufut_pos.exe`.
          - **Linux** — download `fufut-pos-linux-x64.tar.gz`, untar, run
            `./fufut_pos`.
          - **macOS** — built on demand: run the workflow with "Also build
            macOS" checked, then grab `fufut-pos-macos` from the run's
            artifacts.

          The APK is signed with debug keys until a release keystore is added,
          so Android shows the usual "unknown sources" warning — expected.
          NOTES
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Fufut POS $TAG" \
              --notes-file release-notes.md
      - name: Attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            artifacts/fufut-pos-android/*.apk \
            artifacts/fufut-pos-linux/*.tar.gz \
            artifacts/fufut-pos-windows/*.zip
